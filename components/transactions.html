<section class="glass-card rounded-2xl shadow-sm overflow-hidden mb-8">
    <div class="p-5 sm:p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
            <h2 class="font-h3 text-h3 text-lg sm:text-xl font-bold text-slate-900 tracking-tight">
                All Transactions
            </h2>
            <p class="text-xs text-slate-500 mt-0.5">
                Billing history, subscription invoices, and payment receipts
            </p>
        </div>

        <div class="flex items-center gap-2">
            <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-200 bg-slate-50/50 text-xs font-semibold text-slate-600">
                <span class="material-symbols-outlined text-sm text-secondary">verified_user</span>
                Secure Billing
            </span>
        </div>
    </div>

    <div class="overflow-x-auto custom-scrollbar">
        <table class="w-full text-left border-collapse min-w-[760px]">
            <thead class="bg-slate-50/75 border-b border-slate-100">
                <tr>
                    <th class="px-5 sm:px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Transaction</th>
                    <th class="px-5 sm:px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Plan</th>
                    <th class="px-5 sm:px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Amount</th>
                    <th class="px-5 sm:px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Payment</th>
                    <th class="px-5 sm:px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Status</th>
                    <th class="px-5 sm:px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Date</th>
                </tr>
            </thead>

            <tbody id="transactions-table" class="divide-y divide-slate-100 text-sm">
                <!-- Populated dynamically by transactions.js -->
            </tbody>
        </table>
    </div>

    <div class="px-5 sm:px-6 py-3.5 bg-slate-50/50 border-t border-slate-100 flex flex-wrap justify-between items-center gap-3">
        <p class="text-xs sm:text-sm text-slate-500">Showing transactions</p>
        <div class="flex items-center gap-1">
            <button
                class="w-8 h-8 flex items-center justify-center rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 transition-all shadow-2xs">
                <span class="material-symbols-outlined text-sm">chevron_left</span>
            </button>
            <button
                class="w-8 h-8 flex items-center justify-center rounded-lg bg-secondary text-white text-xs font-bold shadow-2xs">1</button>
            <button
                class="w-8 h-8 flex items-center justify-center rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 transition-all shadow-2xs">
                <span class="material-symbols-outlined text-sm">chevron_right</span>
            </button>
        </div>
    </div>
</section>
