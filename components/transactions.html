<section class="glass-card rounded-xl shadow-sm overflow-hidden">

    <div class="px-lg py-md border-b border-outline-variant/30">

        <h2 class="font-h3 text-h3">
            All Transactions
        </h2>

    </div>

    <div class="overflow-x-auto">

        <table class="w-full text-left border-collapse">

            <thead class="bg-surface-container-low">

                <tr>

                    <th class="px-lg py-md uppercase">Transaction</th>
                    <th class="px-lg py-md uppercase">Plan</th>
                    <th class="px-lg py-md uppercase">Amount</th>
                    <th class="px-lg py-md uppercase">Payment</th>
                    <th class="px-lg py-md uppercase">Status</th>
                    <th class="px-lg py-md uppercase">Date</th>
                </tr>

            </thead>

            <tbody id="transactions-table">

            </tbody>

        </table>

    </div>
    <div class="p-lg bg-surface-container-low/30 border-t border-outline-variant/10 flex justify-between items-center">
        <p class="text-sm text-on-surface-variant">Showing 1 to 1 transaction</p>
        <div class="flex gap-xs">
            <button
                class="w-8 h-8 flex items-center justify-center rounded-lg border border-outline-variant/30 hover:bg-surface-container-high transition-all">
                <span class="material-symbols-outlined text-sm">chevron_left</span>
            </button>
            <button
                class="w-8 h-8 flex items-center justify-center rounded-lg bg-primary text-on-primary text-sm font-bold">1</button>
            <button
                class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-surface-container-high text-sm font-medium">2</button>
            <button
                class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-surface-container-high text-sm font-medium">3</button>
            <button
                class="w-8 h-8 flex items-center justify-center rounded-lg border border-outline-variant/30 hover:bg-surface-container-high transition-all">
                <span class="material-symbols-outlined text-sm">chevron_right</span>
            </button>
        </div>
    </div>

</section>
