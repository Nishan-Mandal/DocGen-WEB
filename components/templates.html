<!-- Template Table Container -->
<section class="glass-card rounded-2xl shadow-sm overflow-hidden mb-8">
    <div class="p-5 sm:p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
            <h3 class="font-h3 text-h3 text-lg sm:text-xl font-bold text-slate-900 tracking-tight">All Templates</h3>
            <p class="text-xs text-slate-500 mt-0.5">Manage uploaded DOCX templates, placeholders and dynamic tables</p>
        </div>
        <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
            <div class="relative flex items-center w-full sm:w-60 md:w-72 group">
                <span
                    class="material-symbols-outlined absolute left-3 text-slate-400 group-focus-within:text-secondary text-[18px] transition-colors">search</span>
                <input type="text" placeholder="Search templates..."
                    class="w-full bg-slate-50 border border-slate-200/90 rounded-xl pl-9 pr-8 py-2 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all">
                <button
                    class="absolute right-2 p-1 hover:bg-slate-200/60 rounded-md text-slate-400 hover:text-slate-700 transition-colors"
                    title="Filter">
                    <span class="material-symbols-outlined text-[16px]">filter_list</span>
                </button>
            </div>
            <button id="new-template-btn"
                class="flex items-center gap-1.5 px-3.5 py-2 bg-secondary text-white rounded-xl text-xs sm:text-sm font-semibold hover:opacity-90 transition-all shadow-sm active:scale-95 whitespace-nowrap">
                <span class="material-symbols-outlined text-[18px]">add</span>
                <span>New Template</span>
            </button>
            <!-- Hidden File Input -->
            <input id="template-file" type="file" accept=".docx" class="hidden">
        </div>
    </div>

    <!-- Table Wrapper -->
    <div class="overflow-x-auto custom-scrollbar">
        <table class="w-full text-left border-collapse min-w-[760px]">
            <thead class="bg-slate-50/75 border-b border-slate-100">
                <tr>
                    <th class="px-5 sm:px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Template Name</th>
                    <th class="px-5 sm:px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Template ID</th>
                    <th class="px-5 sm:px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Generations</th>
                    <th class="px-5 sm:px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Created Date</th>
                    <th class="px-5 sm:px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Updated Date</th>
                    <th class="px-5 sm:px-6 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right">
                        Actions
                    </th>
                </tr>
            </thead>
            <tbody id="templates-table-body" class="divide-y divide-slate-100 text-sm">
                <!-- Populated dynamically by templates.js -->
            </tbody>
        </table>
    </div>

    <!-- Footer Controls -->
    <div class="px-5 sm:px-6 py-3.5 bg-slate-50/50 border-t border-slate-100 flex flex-wrap justify-between items-center gap-3">
        <p class="text-xs sm:text-sm text-slate-500">Showing templates</p>
        <div class="flex items-center gap-1">
            <button
                class="w-8 h-8 flex items-center justify-center rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 transition-all shadow-2xs">
                <span class="material-symbols-outlined text-sm">chevron_left</span>
            </button>
            <button
                class="w-8 h-8 flex items-center justify-center rounded-lg bg-secondary text-white text-xs font-bold shadow-2xs">1</button>
            <button
                class="w-8 h-8 flex items-center justify-center rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 transition-all shadow-2xs">
                <span class="material-symbols-outlined text-sm">chevron_right</span>
            </button>
        </div>
    </div>

    <!-- Slide-over Fields Drawer -->
    <div id="fields-drawer" class="hidden fixed inset-0 z-50 overflow-hidden">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-xs transition-opacity"
            onclick="document.getElementById('fields-drawer').classList.add('hidden')"></div>

        <div class="fixed inset-y-0 right-0 max-w-full flex pl-6 sm:pl-10">
            <div class="w-screen max-w-md md:max-w-lg bg-white dark:bg-slate-900 shadow-2xl p-5 sm:p-6 overflow-y-auto custom-scrollbar flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-secondary/10 text-secondary flex items-center justify-center shrink-0">
                                <span class="material-symbols-outlined text-[22px]">data_object</span>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-slate-900">Merge Fields & Tables</h3>
                                <p class="text-xs text-slate-500">Detected placeholders from template</p>
                            </div>
                        </div>

                        <button onclick="document.getElementById('fields-drawer').classList.add('hidden')"
                            class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors">
                            <span class="material-symbols-outlined text-xl">close</span>
                        </button>
                    </div>

                    <div id="merge-fields-container" class="py-4"></div>
                </div>

                <div class="pt-4 border-t border-slate-100 flex justify-end">
                    <button onclick="document.getElementById('fields-drawer').classList.add('hidden')"
                        class="px-4 py-2 rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 text-xs sm:text-sm font-semibold transition-all">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <input id="update-template-file" type="file" accept=".docx" class="hidden">
</section>
