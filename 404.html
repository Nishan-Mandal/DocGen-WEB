<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Page Not Found | EveryPapers</title>
    <meta name="robots" content="noindex, follow">

    <!-- Favicon -->
    <link rel="icon" href="/components/assets/favicon.png" type="image/png">
    <link rel="shortcut icon" href="/components/assets/favicon.png" type="image/png">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .hero-glow {
            background: radial-gradient(circle at 50% 30%, rgba(138, 76, 252, 0.15) 0%, rgba(247, 249, 251, 0) 70%);
        }
    </style>
</head>

<body class="bg-[#f7f9fb] text-slate-900 min-h-screen flex flex-col justify-between hero-glow">
    <!-- Header / Brand -->
    <header class="w-full py-6 px-8 flex justify-center sm:justify-start max-w-7xl mx-auto">
        <a href="/" data-route="home" class="flex items-center gap-2">
            <img src="/components/assets/logo.png" alt="EveryPapers Logo" class="w-10 h-10 object-contain">
            <span class="text-xl font-bold tracking-tight">
                <span class="text-slate-900">Every</span><span class="text-[#712AE2]">Papers</span>
            </span>
        </a>
    </header>

    <!-- Main 404 Container -->
    <main class="flex-1 flex items-center justify-center px-6 py-12">
        <div class="max-w-xl w-full text-center space-y-6">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-purple-100 text-[#712AE2] mb-2 shadow-inner">
                <span class="material-symbols-outlined text-4xl">search_off</span>
            </div>

            <div class="space-y-2">
                <span class="text-xs font-bold uppercase tracking-widest text-[#712AE2] bg-purple-50 px-3 py-1 rounded-full border border-purple-200">Error 404</span>
                <h1 class="text-4xl sm:text-5xl font-extrabold text-slate-900 tracking-tight">Page Not Found</h1>
                <p class="text-base sm:text-lg text-slate-600 max-w-md mx-auto pt-2">
                    The page you're looking for doesn't exist, was renamed, or has been moved.
                </p>
            </div>

            <!-- Action buttons -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4">
                <a href="/" data-route="home"
                    class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-[#712AE2] text-white font-medium hover:bg-[#5e22be] transition-colors shadow-lg shadow-purple-500/20 active:scale-95">
                    <span class="material-symbols-outlined text-xl">home</span>
                    Back to Home
                </a>
                <a href="/docs" data-route="docs"
                    class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl border border-slate-300 bg-white text-slate-700 font-medium hover:bg-slate-50 transition-colors shadow-sm active:scale-95">
                    <span class="material-symbols-outlined text-xl">description</span>
                    Documentation
                </a>
                <a href="/pricing" data-route="pricing"
                    class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl border border-slate-300 bg-white text-slate-700 font-medium hover:bg-slate-50 transition-colors shadow-sm active:scale-95">
                    <span class="material-symbols-outlined text-xl">payments</span>
                    Pricing
                </a>
            </div>
        </div>
    </main>

    <!-- Footer note -->
    <footer class="py-6 text-center text-xs text-slate-400">
        &copy; 2026 EveryPapers. Automated Document Generation API.
    </footer>

    <!-- Dynamic Route Routing for local vs production -->
    <script type="module">
        import { ROUTES } from "./routes.js";
        document.querySelectorAll("[data-route]").forEach((el) => {
            const key = el.dataset.route;
            if (key && ROUTES[key]) {
                el.href = ROUTES[key];
            }
        });
    </script>
</body>

</html>
